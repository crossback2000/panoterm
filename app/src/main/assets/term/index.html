<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <link rel="stylesheet" href="xterm.css">
  <style>
    /* D2Coding (NAVER, SIL OFL 1.1 — see fonts/OFL.txt). Bundled so Korean and box-drawing align in tables. */
    @font-face { font-family: "D2Coding"; src: url("fonts/D2Coding-Regular.ttf") format("truetype"); font-weight: 400; font-style: normal; }
    @font-face { font-family: "D2Coding"; src: url("fonts/D2Coding-Bold.ttf") format("truetype"); font-weight: 700; font-style: normal; }
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    /* Our own long-press selection replaces the browser's (which can't select canvas text anyway). */
    body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    /* #wrap scrolls horizontally in wide-viewport mode; #t is the xterm host. */
    /* explicit edges + height: some WebView builds ignore the `inset` shorthand */
    /* Anchored to the viewport (not body %) — body height can collapse to 0 in some WebViews. */
    #wrap { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
    #wrap::-webkit-scrollbar { display: none; }
    #t { position: relative; height: 100%; padding: 2px 4px; box-sizing: border-box; }
  </style>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script src="addon-unicode11.js"></script>
  <script src="addon-web-links.js"></script>
  <script>
    // Only the renderer addon the chosen renderer starts with (each is ~100 KB of JS to parse);
    // term.js loads another on demand (settings change, fallback from WebGL to Canvas).
    (function () {
      var r = new URLSearchParams(location.hash.slice(1)).get('r') || 'auto';
      var name = r === 'canvas' ? 'canvas' : (r === 'webgl' || r === 'auto') ? 'webgl' : '';
      if (name) document.write('<script src="addon-' + name + '.js"><\/script>');
    })();
  </script>
</head>
<body>
  <div id="wrap"><div id="t"></div></div>
  <script src="term.js"></script>
</body>
</html>
