# Tests on every push / pull request. Uses no secrets (safe for pull requests from forks).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails if gradle-wrapper.jar is not an official Gradle release (a tampered jar runs on every build).
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Go tests
        working-directory: core
        run: go test -count=1 ./...

      # Table lens / reader mode / approval prompt parsing (app/src/main/assets/term/tables.js).
      # Uses the runner's preinstalled Node; no packages.
      - name: JS tests
        run: node --test app/src/test/js/*.test.js

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.2" "build-tools;37.0.0" "ndk;30.0.16248370" > /dev/null

      - name: Build Go core (core.aar)
        run: bash scripts/build-core.sh

      # lintDebug fails on any lint error (e.g. NewApi: an API newer than minSdk 31).
      # Known false positives are suppressed in code with the reason next to them.
      - name: Unit tests + lint + debug build
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload lint report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
