# Builds, signs and publishes a release.
#   - push a tag "vX.Y.Z"  → GitHub release with PanoTerm-X.Y.Z.apk (phones auto-update)
#   - "Run workflow" button → dry run: build + sign + verify, APK kept as a workflow artifact
#
# The signing key lives ONLY in encrypted repository secrets (never in the repo):
#   PANOTERM_KEYSTORE_B64, PANOTERM_STORE_PASSWORD, PANOTERM_KEY_ALIAS, PANOTERM_KEY_PASSWORD
# Secrets are not given to workflows triggered by pull requests from forks.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Test build version, e.g. 1.3.10-rc1 (installs over the current app). Empty = 0.0.<run>-dryrun'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Public fingerprint of the release signing certificate. The build fails if the APK is
  # signed with anything else, so a wrong/missing key can never break auto-update.
  EXPECTED_CERT_SHA256: 172cd9981f16a1deb8b52fdd244386385276812a9101cd5b4ad475b083ccacf1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: Version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            # Release candidate: a real version code, so it installs over the current app.
            # Never published (only tags publish); the final X.Y.Z counts as newer than X.Y.Z-rcN.
            if ! printf '%s' "$INPUT_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.]+$'; then
              echo "::error::version must look like 1.3.10-rc1"; exit 1
            fi
            V="$INPUT_VERSION"
          else
            V="0.0.${GITHUB_RUN_NUMBER}-dryrun"
          fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          # 1.3.2 → 10302 (always above the old 1xx scheme, so updates install)
          echo "code=$(( MA * 10000 + MI * 100 + PA ))" >> "$GITHUB_OUTPUT"
          echo "Version $V"

      - name: Go tests
        working-directory: core
        run: go test -count=1 ./...

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865" > /dev/null

      - name: Build Go core (core.aar)
        env:
          CORE_TARGETS: android/arm64 # the release APK ships arm64 only
        run: bash scripts/build-core.sh

      - name: Signing key (from encrypted secrets)
        env:
          KEYSTORE_B64: ${{ secrets.PANOTERM_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.PANOTERM_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PANOTERM_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PANOTERM_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is missing"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"
          echo "PANOTERM_KEYSTORE_PROPS=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Unit tests + release build
        run: |
          bash ./gradlew --no-daemon testDebugUnitTest assembleRelease \
            -PvName=${{ steps.ver.outputs.name }} -PvCode=${{ steps.ver.outputs.code }}

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/keystore.properties"

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > cert.txt
          grep -q "SHA-256 digest: $EXPECTED_CERT_SHA256" cert.txt \
            || { echo "::error::APK is not signed with the PanoTerm release key"; exit 1; }
          cp "$APK" "PanoTerm-${{ steps.ver.outputs.name }}.apk"
          sha256sum "PanoTerm-${{ steps.ver.outputs.name }}.apk"

      - name: Keep APK (dry run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: PanoTerm-${{ steps.ver.outputs.name }}
          path: PanoTerm-*.apk
          retention-days: 7

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.ver.outputs.name }}"
          NOTES="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$GITHUB_REF_NAME" "PanoTerm-$V.apk" --title "PanoTerm $V" --notes-file "$NOTES"
          else
            gh release create "$GITHUB_REF_NAME" "PanoTerm-$V.apk" --title "PanoTerm $V" --generate-notes
          fi
